<mat-toolbar color="primary">
    <span class="brand">Shopping Card</span>
    <nav>
            <a mat-button routerLink="/" routerLinkActive="active-link">Home</a>
        @if(authService.user()){
            <a mat-button routerLink="/shopping-cart" routerLinkActive="active-link">
            Shopping Cart
        </a>
    }
    </nav>
    <span class="spacer"></span>

    @if(authService.user()){<app-shopping-cart />}

    @if (authService.user()) {
        <button (click)="logout()" mat-stroked-button>Logout</button>
    } @else {
        <button (click)="goToLoginPage()" mat-stroked-button>Login</button>
    }
</mat-toolbar>
