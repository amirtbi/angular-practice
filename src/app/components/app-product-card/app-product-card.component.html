<mat-card class="product-card">
    <mat-card-header>
        <div mat-card-avatar class="product-card-avatar" [style.background-image]="'url(' + product.image + ')'"></div>
        <mat-card-title>{{product.title}}</mat-card-title>
        <mat-card-subtitle>{{product.subtitle}}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="product.image" [alt]="product.title">
    <mat-card-content>
        <p>{{product.description}}</p>
        <p>${{product.price}}</p>
    </mat-card-content>
    <mat-card-actions>
        <button mat-button (click)="addProduct(product)">Add to cart</button>
        <button mat-button (click)="removeProductFromCart(product.id)">Remove from cart</button>
    </mat-card-actions>
</mat-card>
